document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; margin-left: -8px;\">{{ u.moreAppsLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size: 12.5px; color: #838383;\">{{ u.appsCountLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #5c5c5c;\">{{ u.lastSeenDisplay }}<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{ u.statusColor }};\">\n            <span style=\"width: 7px; height: 7px; border-radius: 50%; background: {{ u.statusColor }};\"><\u002Fspan>{{ u.statusLabel }}\n          <\u002Fdiv>\n          <div style=\"position: relative;\">\n            <button type=\"button\" data-id=\"{{ u.id }}\" sc-camel-on-click=\"{{ toggleUserMenu }}\" aria-label=\"More\" style=\"border: none; background: none; cursor: pointer; color: #838383; font-size: 18px; padding: 4px 8px;\">⋮<\u002Fbutton>\n            <sc-if value=\"{{ u.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position: absolute; top: 32px; right: 0; z-index: 20; background: #fff; border: 1px solid rgba(0,0,0,.1); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); min-width: 190px; padding: 6px;\">\n                <button type=\"button\" data-id=\"{{ u.id }}\" sc-camel-on-click=\"{{ openEditUser }}\" style=\"display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #151515;\">Edit user<\u002Fbutton>\n                <button type=\"button\" data-id=\"{{ u.id }}\" sc-camel-on-click=\"{{ toggleActive }}\" style=\"display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #151515;\">{{ u.toggleActiveLabel }}<\u002Fbutton>\n                <button type=\"button\" data-id=\"{{ u.id }}\" sc-camel-on-click=\"{{ removeUser }}\" style=\"display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: #c0392b;\">Remove user<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noUsersFound }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 40px 20px; text-align: center; color: #838383; font-size: 14px;\">No users match your filters.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRolesTab }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <sc-for list=\"{{ apps }}\" as=\"app\" hint-placeholder-count=\"6\">\n        <button type=\"button\" data-id=\"{{ app.id }}\" sc-camel-on-click=\"{{ selectApp }}\" style=\"font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 8px 16px; cursor: pointer; border: 1px solid {{ app.selectedBorder }}; background: {{ app.selectedBg }}; color: {{ app.selectedColor }};\">{{ app.name }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border: 1px solid rgba(0,0,0,.08); border-radius: 20px; padding: 22px; margin-bottom: 18px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;\">\n        <h2 style=\"margin: 0; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 19px; color: #151515;\">{{ selectedAppName }} roles<\u002Fh2>\n        <span style=\"font-size: 12.5px; color: #838383;\">Roles set what a user can do only inside this app<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 12px;\">\n        <sc-for list=\"{{ appRoles }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; align-items: center; gap: 16px; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 12px 16px;\">\n            <span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{ r.color }}; flex: none;\"><\u002Fspan>\n            <span style=\"font-weight: 700; font-size: 14px; color: #151515; min-width: 140px;\">{{ r.name }}<\u002Fspan>\n            <span style=\"font-size: 12.5px; color: #838383; min-width: 90px;\">{{ r.userCount }} users<\u002Fspan>\n            <div style=\"display: flex; gap: 6px; flex: 1;\">\n              <sc-for list=\"{{ r.levelOptions }}\" as=\"lvl\" hint-placeholder-count=\"4\">\n                <label style=\"display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: #5c5c5c; cursor: pointer;\">\n                  <input type=\"radio\" data-role=\"{{ r.id }}\" data-level=\"{{ lvl.value }}\" checked=\"{{ lvl.checked }}\" sc-camel-on-change=\"{{ setRoleLevel }}\" style=\"width: 14px; height: 14px; accent-color: #273097; cursor: pointer;\">{{ lvl.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ r.editable }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" data-id=\"{{ r.id }}\" sc-camel-on-click=\"{{ deleteRole }}\" style=\"border: none; background: none; color: #c0392b; font-size: 12px; font-weight: 700; cursor: pointer;\">Delete<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border: 1px solid rgba(0,0,0,.08); border-radius: 20px; padding: 22px;\">\n      <div style=\"margin-bottom: 16px;\">\n        <h2 style=\"margin: 0 0 4px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 19px; color: #151515;\">{{ selectedAppName }} custom settings<\u002Fh2>\n        <span style=\"font-size: 12.5px; color: #838383;\">Extra per-user options for this app, like price lists — shown alongside the role when editing a user<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 16px;\">\n        <sc-for list=\"{{ extraGroupsForApp }}\" as=\"grp\" hint-placeholder-count=\"1\">\n          <div style=\"border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 14px 16px;\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;\">\n              <span style=\"font-weight: 700; font-size: 13.5px; color: #151515;\">{{ grp.label }}<\u002Fspan>\n              <button type=\"button\" data-group=\"{{ grp.key }}\" sc-camel-on-click=\"{{ removeExtraGroup }}\" style=\"border: none; background: none; color: #c0392b; font-size: 12px; font-weight: 700; cursor: pointer;\">Remove setting<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;\">\n              <sc-for list=\"{{ grp.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                <span style=\"display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; background: rgba(39,48,151,.07); color: #273097; border-radius: 999px; padding: 5px 8px 5px 12px;\">\n                  {{ opt.value }}\n                  <button type=\"button\" data-group=\"{{ grp.key }}\" data-option=\"{{ opt.value }}\" sc-camel-on-click=\"{{ removeExtraOption }}\" aria-label=\"Remove option\" style=\"border: none; background: none; color: #273097; cursor: pointer; display: flex; opacity: .6; padding: 2px;\">\n                    <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fs nt-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 20px; color: #273097;\">New role<\u002Fh2>\n        <label style=\"display: block; font-size: 13px; font-weight: 600; color: #5c5c5c; margin-bottom: 6px;\">App<\u002Flabel>\n        <sc-raw-select class=\"um-input\" value=\"{{ newRoleAppId }}\" sc-camel-on-change=\"{{ setNewRoleAppId }}\" style=\"width: 100%; border-radius: 8px; margin-bottom: 16px; color: #151515; font-weight: 600;\">\n          <sc-for list=\"{{ apps }}\" as=\"app\" hint-placeholder-count=\"6\">\n            <option value=\"{{ app.id }}\">{{ app.name }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <label style=\"display: block; font-size: 13px; font-weight: 600; color: #5c5c5c; margin-bottom: 6px;\">Role name<\u002Flabel>\n        <input class=\"um-input\" placeholder=\"e.g. Manager\" value=\"{{ newRoleName }}\" sc-camel-on-change=\"{{ setNewRoleName }}\" style=\"width: 100%; border-radius: 8px; margin-bottom: 20px;\">\n        <div style=\"display: flex; justify-content: flex-end; gap: 10px;\">\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ closeRoleModal }}\" style=\"background: #fff; color: #5c5c5c; border: 1px solid rgba(0,0,0,.12); padding: 8px 20px; font-size: 13.5px;\">Cancel<\u002Fbutton>\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ submitNewRole }}\" style=\"background: #273097; color: #fff; padding: 8px 22px; font-size: 13.5px;\">Create<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ inviteModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center;\" sc-camel-on-click=\"{{ closeInvite }}\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background: #fff; border-radius: 24px; padding: 32px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 84vh; overflow: auto;\">\n        <h2 style=\"margin: 0 0 18px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 20px; color: #273097;\">Add user<\u002Fh2>\n        <label style=\"display: block; font-size: 13px; font-weight: 600; color: #5c5c5c; margin-bottom: 6px;\">Email<\u002Flabel>\n        <input class=\"um-input\" placeholder=\"name@company.com\" value=\"{{ inviteEmail }}\" sc-camel-on-change=\"{{ setInviteEmail }}\" style=\"width: 100%; border-radius: 8px; margin-bottom: 18px;\">\n        <label style=\"display: block; font-size: 13px; font-weight: 600; color: #5c5c5c; margin-bottom: 10px;\">App access<\u002Flabel>\n        <div style=\"display: grid; gap: 10px; margin-bottom: 20px;\">\n          <sc-for list=\"{{ inviteAppRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"display: flex; align-items: center; gap: 12px; border: 1px solid rgba(0,0,0,.08); border-radius: 12px; padding: 10px 14px;\">\n              <input type=\"checkbox\" data-app=\"{{ row.appId }}\" checked=\"{{ row.enabled }}\" sc-camel-on-change=\"{{ toggleInviteApp }}\" style=\"width: 16px; height: 16px; accent-color: #273097; cursor: pointer;\">\n              <span style=\"font-size: 13.5px; font-weight: 600; flex: 1;\">{{ row.appName }}<\u002Fspan>\n              <sc-if value=\"{{ row.enabled }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-raw-select data-app=\"{{ row.appId }}\" value=\"{{ row.roleId }}\" sc-camel-on-change=\"{{ setInviteAppRole }}\" style=\"border: 1px solid rgba(0,0,0,.15); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; color: #273097;\">\n                  <sc-for list=\"{{ row.roleOptions }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                    <option value=\"{{ opt.id }}\">{{ opt.name }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: flex-end; gap: 10px;\">\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ closeInvite }}\" style=\"background: #fff; color: #5c5c5c; border: 1px solid rgba(0,0,0,.12); padding: 8px 20px; font-size: 13.5px;\">Cancel<\u002Fbutton>\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ submitInvite }}\" style=\"background: #273097; color: #fff; padding: 8px 22px; font-size: 13.5px;\">Send invite<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ editUserModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px;\" sc-camel-on-click=\"{{ closeEditUser }}\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"background: #fff; border-radius: 24px; padding: 36px 44px; width: 100%; max-width: 1040px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow: auto; position: relative;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeEditUser }}\" aria-label=\"Close\" style=\"position: absolute; top: 28px; right: 32px; width: 34px; height: 34px; border-radius: 999px; border: none; background: #273097; color: #fff; cursor: pointer; font-weight: 700;\">✕<\u002Fbutton>\n        <h2 style=\"margin: 0 0 22px; text-align: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 26px; color: #273097;\">Edit user<\u002Fh2>\n\n        <div style=\"display: flex; gap: 4px; border-bottom: 1px solid rgba(0,0,0,.08); margin-bottom: 26px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ setEditTabGeneral }}\" style=\"background: none; border: none; cursor: pointer; padding: 10px 4px; margin-right: 24px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 14px; color: {{ editTabGeneralColor }}; border-bottom: 2px solid {{ editTabGeneralBorder }};\">General<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ setEditTabAccess }}\" style=\"background: none; border: none; cursor: pointer; padding: 10px 4px; margin-right: 24px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 14px; color: {{ editTabAccessColor }}; border-bottom: 2px solid {{ editTabAccessBorder }};\">App access &amp; roles<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ setEditTabSecurity }}\" style=\"background: none; border: none; cursor: pointer; padding: 10px 4px; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 700; font-size: 14px; color: {{ editTabSecurityColor }}; border-bottom: 2px solid {{ editTabSecurityBorder }};\">Security<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isEditTabGeneral }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; gap: 24px; align-items: center; margin-bottom: 24px;\">\n            <image-slot id=\"{{ editAvatarSlotId }}\" shape=\"circle\" placeholder=\"Photo\" style=\"width: 84px; height: 84px; flex: none;\"><\u002Fimage-slot>\n            <div>\n              <div style=\"font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 8px;\">Username display color<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 8px;\">\n                <sc-for list=\"{{ colorSwatches }}\" as=\"sw\" hint-placeholder-count=\"6\">\n                  <button type=\"button\" class=\"um-swatch\" data-active=\"{{ sw.active }}\" data-color=\"{{ sw.value }}\" sc-camel-on-click=\"{{ setEditAvatarColor }}\" style=\"background: {{ sw.value }};\" aria-label=\"{{ sw.value }}\"><\u002Fbutton>\n                <\u002Fsc-for>\n                <button type=\"button\" sc-camel-on-click=\"{{ clearEditAvatarColor }}\" style=\"font-size: 12px; font-weight: 600; color: #838383; background: none; border: 1px solid rgba(0,0,0,.12); border-radius: 999px; padding: 5px 12px; cursor: pointer; margin-left: 4px;\">Clear color<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px 32px; max-width: 760px;\">\n            <div>\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Username<\u002Flabel>\n              <input class=\"um-input\" style=\"width: 100%; border-radius: 8px;\" value=\"{{ editDraft.username }}\" sc-camel-on-change=\"{{ setEditField_username }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Number<\u002Flabel>\n              <input class=\"um-input\" style=\"width: 100%; border-radius: 8px;\" value=\"{{ editDraft.number }}\" sc-camel-on-change=\"{{ setEditField_number }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Email<\u002Flabel>\n              <input class=\"um-input\" style=\"width: 100%; border-radius: 8px;\" value=\"{{ editDraft.email }}\" sc-camel-on-change=\"{{ setEditField_email }}\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Second email<\u002Flabel>\n              <input class=\"um-input\" style=\"width: 100%; border-radius: 8px;\" placeholder=\"e.g. billing@company.com\" value=\"{{ editDraft.secondEmail }}\" sc-camel-on-change=\"{{ setEditField_secondEmail }}\">\n            <\u002Fdiv>\n            <div style=\"grid-column: 1 / -1;\">\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Address<\u002Flabel>\n              <input class=\"um-input\" style=\"width: 100%; border-radius: 8px;\" value=\"{{ editDraft.address }}\" sc-camel-on-change=\"{{ setEditField_address }}\">\n            <\u002Fdiv>\n            <div style=\"grid-column: 1 / -1;\">\n              <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Description<\u002Flabel>\n              <textarea class=\"um-input\" style=\"width: 100%; border-radius: 8px; min-height: 76px; resize: vertical; font: inherit;\" value=\"{{ editDraft.description }}\" sc-camel-on-change=\"{{ setEditField_description }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEditTabAccess }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;\">\n            <sc-for list=\"{{ editAccessRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"border-radius: 16px; overflow: hidden; border: 1px solid {{ row.borderColor }}; background: {{ row.cardBg }}; align-self: start; transition: background .15s;\">\n                <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px 16px;\">\n                  <span style=\"width: 38px; height: 38px; border-radius: 11px; background: {{ row.iconBg }}; color: {{ row.iconColor }}; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', Inter, sans-serif; font-weight: 800; font-size: 14px; flex: none;\">{{ row.initial }}<\u002Fspan>\n                  <div style=\"flex: 1; min-width: 0;\">\n                    <div style=\"font-weight: 700; font-size: 14px; color: #151515;\">{{ row.appName }}<\u002Fdiv>\n                    <div style=\"font-size: 11.5px; font-weight: 600; color: {{ row.statusColor }};\">{{ row.statusLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button type=\"button\" data-app=\"{{ row.appId }}\" sc-camel-on-click=\"{{ toggleEditAccessApp }}\" aria-label=\"Toggle access\" style=\"width: 42px; height: 24px; border-radius: 999px; border: none; cursor: pointer; background: {{ row.switchBg }}; position: relative; flex: none; padding: 0;\">\n                    <span style=\"position: absolute; top: 3px; left: {{ row.switchDotLeft }}; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s;\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ row.enabled }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding: 0 16px 16px;\">\n                    <sc-raw-select data-app=\"{{ row.appId }}\" value=\"{{ row.roleId }}\" sc-camel-on-change=\"{{ setEditAccessAppRole }}\" style=\"width: 100%; border: 1px solid {{ row.borderColor }}; background: #fff; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; font-weight: 700; color: {{ row.accentColor }};\">\n                      <sc-for list=\"{{ row.roleOptions }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                        <option value=\"{{ opt.id }}\">{{ opt.name }}<\u002Foption>\n                      <\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                    <sc-if value=\"{{ row.showExtra }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top: 12px; padding-top: 12px; border-top: 1px solid {{ row.borderColor }};\">\n                        <sc-for list=\"{{ row.extraGroups }}\" as=\"grp\" hint-placeholder-count=\"1\">\n                          <div style=\"margin-bottom: 6px;\">\n                            <div style=\"font-size: 11px; font-weight: 700; color: #5c5c5c; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px;\">{{ grp.label }}<\u002Fdiv>\n                            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n                              <sc-for list=\"{{ grp.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                                <label data-checked=\"{{ opt.checked }}\" style=\"display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer; background: {{ opt.chipBg }}; color: {{ opt.chipColor }}; border: 1px solid {{ opt.chipBorder }};\">\n                                  <input type=\"checkbox\" data-app=\"{{ row.appId }}\" data-group=\"{{ grp.key }}\" data-option=\"{{ opt.value }}\" checked=\"{{ opt.checked }}\" sc-camel-on-change=\"{{ toggleEditExtraOption }}\" style=\"width: 0; height: 0; opacity: 0; position: absolute;\">{{ opt.value }}\n                                <\u002Flabel>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isEditTabSecurity }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width: 360px;\">\n            <label style=\"display: block; font-size: 13px; font-weight: 600; color: #151515; margin-bottom: 5px;\">Password<\u002Flabel>\n            <input class=\"um-input\" style=\"width: 100%; border-radius: 8px; margin-bottom: 12px;\" type=\"password\" value=\"********\" sc-camel-read-only=\"{{ true }}\">\n            <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ sendResetLink }}\" style=\"background: #fff; color: #273097; border: 1px solid rgba(39,48,151,.3); padding: 8px 18px; font-size: 13px;\">Send reset link<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px;\">\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ closeEditUser }}\" style=\"background: #fff; color: #5c5c5c; border: 1px solid rgba(0,0,0,.12); padding: 9px 22px; font-size: 13.5px;\">Cancel<\u002Fbutton>\n          <button type=\"button\" class=\"um-btn\" sc-camel-on-click=\"{{ saveEditUser }}\" style=\"background: #273097; color: #fff; padding: 9px 26px; font-size: 13.5px;\">Save changes<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst APPS = [\n  { id: 'archive', name: 'Archive' },\n  { id: 'booking', name: 'Booking system' },\n  { id: 'website_orders', name: 'Website orders' },\n  { id: 'edit_website', name: 'Edit website' },\n  { id: 'custom_hours', name: 'Custom hours' },\n  { id: 'user_mgmt', name: 'User management' },\n];\nconst LEVELS = [\n  { value: 'view', label: 'View' },\n  { value: 'edit', label: 'Edit' },\n  { value: 'admin', label: 'Admin' },\n  { value: 'owner', label: 'Owner' },\n];\nconst ROLE_COLORS = ['#273097', '#7a5cc7', '#2e9e6b', '#c67139', '#c0507a', '#3a8fb7'];\nconst AVATAR_DEFAULT_COLOR = '#273097';\nconst AVATAR_COLOR_SWATCHES = ['#273097', '#7a5cc7', '#2e9e6b', '#c67139', '#c0507a', '#3a8fb7'];\n// Per-app extra settings schema — add an entry here whenever a new app needs its own\n// beyond-role settings (e.g. price lists). Each group renders as a checkbox list.\nconst APP_EXTRA_SETTINGS = {\n  booking: [{ key: 'priceLists', label: 'Price lists', options: ['Power Price List', 'Flugger', 'Only Pallets'] }],\n  website_orders: [{ key: 'priceLists', label: 'Price lists', options: ['Power Price List', 'Flugger'] }],\n};\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'users',\n    appFilter: 'all',\n    userSearch: '',\n    selectedAppId: 'archive',\n    roles: [\n      { id: 'archive_owner', appId: 'archive', name: 'Owner', level: 'owner', editable: false },\n      { id: 'archive_editor', appId: 'archive', name: 'Editor', level: 'edit', editable: true },\n      { id: 'archive_viewer', appId: 'archive', name: 'Viewer', level: 'view', editable: true },\n      { id: 'booking_owner', appId: 'booking', name: 'Owner', level: 'owner', editable: false },\n      { id: 'booking_staff', appId: 'booking', name: 'Staff', level: 'edit', editable: true },\n      { id: 'booking_viewer', appId: 'booking', name: 'Viewer', level: 'view', editable: true },\n      { id: 'wo_owner', appId: 'website_orders', name: 'Owner', level: 'owner', editable: false },\n      { id: 'wo_creator', appId: 'website_orders', name: 'Order creator', level: 'edit', editable: true },\n      { id: 'ew_owner', appId: 'edit_website', name: 'Owner', level: 'owner', editable: false },\n      { id: 'ew_editor', appId: 'edit_website', name: 'Editor', level: 'edit', editable: true },\n      { id: 'ch_owner', appId: 'custom_hours', name: 'Owner', level: 'owner', editable: false },\n      { id: 'ch_editor', appId: 'custom_hours', name: 'Editor', level: 'edit', editable: true },\n      { id: 'um_admin', appId: 'user_mgmt', name: 'Admin', level: 'admin', editable: false },\n    ],\n    users: [\n      { id: 1, username: 'IT work', email: 'itworkotman@gmail.com', secondEmail: '', number: '', address: 'Otto Blehrs vei 25c, 1397 Nesøya, Norge', description: 'IT team profile', avatarColor: AVATAR_DEFAULT_COLOR, online: true, active: true,\n        access: [{ appId: 'archive', roleId: 'archive_owner' }, { appId: 'booking', roleId: 'booking_owner' }, { appId: 'website_orders', roleId: 'wo_owner' }, { appId: 'edit_website', roleId: 'ew_owner' }, { appId: 'custom_hours', roleId: 'ch_owner' }, { appId: 'user_mgmt', roleId: 'um_admin' }],\n        extraSettings: { booking: { priceLists: ['Power Price List'] }, website_orders: { priceLists: ['Power Price List'] } },\n        lastSeenDisplay: 'Online' },\n      { id: 2, username: 'TEST POWER', email: 'r.kolveits@gmai
